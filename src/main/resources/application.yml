server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: blogging-platform

  datasource:
    url: jdbc:mysql://mysql-9232921-blog-platform.l.aivencloud.com:12277/blog_platform?sslMode=REQUIRED
    username: ${username}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000     
      max-lifetime: 1800000    
      connection-timeout: 10000 

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20  # mitigates N+1 for lazy collections
    open-in-view: false          # avoid OSIV anti-pattern; fetch what you need in service layer

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:ZmFrZS1zdXBlci1sb25nLXNlY3JldC1rZXktZm9yLWp3dC1obWFjLXNoYTI1Ni1hbGdvcml0aG0tY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
    issuer: blogging-platform-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.blogplatform: DEBUG
    org.hibernate.SQL: WARN
